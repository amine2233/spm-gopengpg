name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 2.10.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Go version
        run: echo "GO_VERSION=$(sed -n 's/^GO_VERSION="\(.*\)"/\1/p' gopenpgp_build.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build, package, smoke test, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gopenpgp_build.sh all "${{ inputs.version }}"
